name: Bug Report
description: Report a bug, crash, or UI issue in Hyper120
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Hyper120 Version
      placeholder: "e.g. v3.9"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & OS Version
      placeholder: "e.g. Xiaomi 14 / HyperOS / Android 16"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce & Expected vs Actual Behavior
    validations:
      required: true
