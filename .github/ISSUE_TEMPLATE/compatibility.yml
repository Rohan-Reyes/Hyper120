name: Device Compatibility Report
description: Report whether Hyper120 works or is locked at 60Hz on your Xiaomi / Redmi / POCO device
title: "[Compatibility] <Device Model> - Working / Not Working"
labels: ["compatibility"]
body:
  - type: dropdown
    id: status
    attributes:
      label: What happened in the Hyper120 test?
      options:
        - "The test reached the requested rate or higher"
        - "The test stayed below the requested rate"
        - "The app could not run the test"
        - "I only tested gameplay"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device Model & Codename
      placeholder: "e.g. Xiaomi 14 (houji) / POCO M6 Pro 5G"
    validations:
      required: true
  - type: input
    id: rom
    attributes:
      label: HyperOS / MIUI & Android Version
      placeholder: "e.g. HyperOS 2.0 Global / Android 15"
    validations:
      required: true
  - type: textarea
    id: tester
    attributes:
      label: Check override report (Hyper120 → Check override → Copy report)
      placeholder: "Include the requested rate, display mode and measured test FPS."
  - type: textarea
    id: notes
    attributes:
      label: Games Tested & Notes
      placeholder: "Game and version, available FPS options, graphics preset and game mode, observed FPS and the counter used."
